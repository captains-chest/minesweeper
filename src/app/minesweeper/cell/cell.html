<button
  type="button"
  role="gridcell"
  [class]="classList()"
  [attr.data-index]="cell().index"
  [attr.data-number]="cell().adjacentMines"
  [attr.aria-rowindex]="row()"
  [attr.aria-colindex]="column()"
  [attr.aria-label]="label()"
  aria-keyshortcuts="Enter Space F ArrowLeft ArrowRight ArrowUp ArrowDown Home End Control+Home Control+End PageUp PageDown"
  [attr.tabindex]="tabIndex()"
  (click)="onPrimaryAction()"
  (contextmenu)="onContextMenu($event)"
  (keydown)="onKeydown($event)"
  (keyup.space)="$event.preventDefault()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel($event)"
>
  {{ display() }}
</button>
